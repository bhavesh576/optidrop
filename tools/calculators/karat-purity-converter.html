<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<a href="#main-content" style="position:absolute;left:-9999px;z-index:9999;padding:0.5rem 1rem;background:#fff;color:#2563eb;font-weight:600;">Skip to main content</a>
<noscript><div style="text-align:center;padding:2rem;background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;margin:2rem auto;max-width:500px;font-family:sans-serif;"><h2 style="color:#92400e;">JavaScript Required</h2><p style="color:#78350f;">Please enable JavaScript and reload.</p></div></noscript>
    <header class="site-header"></header>
    <main id="main-content" class="flex-grow">
        <section class="max-w-4xl mx-auto px-4 pt-8 pb-4 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-3">Karat to Purity Converter</h1>
            <p class="text-slate-600 max-w-2xl mx-auto">Convert between karat values (24K, 22K, 18K, etc.) and purity percentages. Also calculate gold value.</p>
        </section>

        <section class="max-w-xl mx-auto px-4 pb-8">
            <div class="glass-panel rounded-2xl shadow-xl p-6 sm:p-8">
                <!-- Karat Reference Table -->
                <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                    <p class="text-sm font-bold text-amber-800 mb-2">Quick Reference:</p>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                        <div class="p-2 bg-white rounded-lg"><strong>24K</strong> = 99.9%</div>
                        <div class="p-2 bg-white rounded-lg"><strong>22K</strong> = 91.6%</div>
                        <div class="p-2 bg-white rounded-lg"><strong>18K</strong> = 75.0%</div>
                        <div class="p-2 bg-white rounded-lg"><strong>14K</strong> = 58.5%</div>
                        <div class="p-2 bg-white rounded-lg"><strong>10K</strong> = 41.7%</div>
                        <div class="p-2 bg-white rounded-lg"><strong>9K</strong> = 37.5%</div>
                    </div>
                </div>

                <form id="converterForm" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Karat Value</label>
                            <select id="karatSelect" class="settings-select" onchange="document.getElementById('purity').value=this.value">
                                <option value="99.9">24K (99.9%)</option>
                                <option value="91.6">22K (91.6%)</option>
                                <option value="75">18K (75%)</option>
                                <option value="58.5">14K (58.5%)</option>
                                <option value="41.7">10K (41.7%)</option>
                                <option value="37.5">9K (37.5%)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Purity (%)</label>
                            <input type="number" id="purity" min="1" max="100" step="0.1" value="99.9" placeholder="e.g. 91.6" class="dim-input">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Weight (grams)</label>
                        <input type="number" id="weight" min="0.01" step="0.01" placeholder="e.g. 10" class="dim-input">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Rate per Gram (₹)</label>
                        <input type="number" id="rate" min="1" placeholder="e.g. 6500" class="dim-input">
                    </div>
                    <button type="submit" class="w-full px-6 py-3.5 bg-amber-600 text-white font-bold rounded-xl hover:bg-amber-700 shadow-md transition-all">Convert & Calculate</button>
                </form>

                <div id="result" class="hidden mt-6 space-y-3">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl text-center">
                        <p class="text-sm font-semibold text-amber-700 mb-1">Purity</p>
                        <p class="text-3xl font-extrabold text-amber-800" id="purityResult">0%</p>
                    </div>
                    <div id="valueSection" class="hidden p-5 bg-green-50 border border-green-200 rounded-xl text-center">
                        <p class="text-sm font-semibold text-green-700 mb-1">Estimated Value</p>
                        <p class="text-3xl font-extrabold text-green-800" id="valueResult">₹0</p>
                        <p class="text-xs text-green-600 mt-1" id="valueFormula"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer"></footer>
    <div id="toast-container"></div>
    <script src="/common.js?v=4.0"></script>
    <script>
    (function() {
        document.getElementById('converterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var purity = parseFloat(document.getElementById('purity').value);
            var weight = parseFloat(document.getElementById('weight').value);
            var rate = parseFloat(document.getElementById('rate').value);

            if (isNaN(purity) || purity <= 0 || purity > 100) {
                if (typeof showToast === 'function') showToast('Please enter a valid purity.', 'error');
                return;
            }

            document.getElementById('purityResult').textContent = purity + '%';
            document.getElementById('result').classList.remove('hidden');

            if (!isNaN(weight) && weight > 0 && !isNaN(rate) && rate > 0) {
                var pureWeight = weight * (purity / 100);
                var value = pureWeight * rate;
                document.getElementById('valueResult').textContent = '₹' + Math.round(value).toLocaleString('en-IN');
                document.getElementById('valueFormula').textContent = pureWeight.toFixed(2) + 'g × ₹' + rate.toLocaleString('en-IN');
                document.getElementById('valueSection').classList.remove('hidden');
            } else {
                document.getElementById('valueSection').classList.add('hidden');
            }

            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    })();
    </script>
