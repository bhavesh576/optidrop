<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<a href="#main-content" style="position:absolute;left:-9999px;z-index:9999;padding:0.5rem 1rem;background:#fff;color:#2563eb;font-weight:600;">Skip to main content</a>
<noscript><div style="text-align:center;padding:2rem;background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;margin:2rem auto;max-width:500px;font-family:sans-serif;"><h2 style="color:#92400e;">JavaScript Required</h2><p style="color:#78350f;">Please enable JavaScript and reload.</p></div></noscript>
    <header class="site-header"></header>
    <main id="main-content" class="flex-grow">
        <section class="max-w-4xl mx-auto px-4 pt-8 pb-4 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-3">RD Calculator</h1>
            <p class="text-slate-600 max-w-2xl mx-auto">Calculate Recurring Deposit (RD) maturity amount with quarterly compounding. Plan your monthly savings.</p>
        </section>

        <section class="max-w-xl mx-auto px-4 pb-8">
            <div class="glass-panel rounded-2xl shadow-xl p-6 sm:p-8">
                <form id="rdForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Monthly Deposit (₹) *</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold">₹</span>
                            <input type="number" id="deposit" required min="100" placeholder="e.g. 5000" class="dim-input pl-8">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Interest Rate (% p.a.)</label>
                            <input type="number" id="rate" min="1" max="15" step="0.1" value="6.5" class="dim-input">
                            <p class="text-xs text-slate-400 mt-1">Check current bank RD rates</p>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Tenure (Months) *</label>
                            <input type="number" id="tenure" required min="6" max="120" placeholder="e.g. 24" class="dim-input">
                        </div>
                    </div>
                    <button type="submit" class="w-full px-6 py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-md transition-all">Calculate RD Maturity</button>
                </form>

                <div id="result" class="hidden mt-6">
                    <div class="p-5 bg-green-50 border border-green-200 rounded-xl text-center mb-4">
                        <p class="text-sm font-semibold text-green-700 mb-1">Maturity Amount</p>
                        <p class="text-4xl font-extrabold text-green-800" id="maturityAmount">₹0</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-4 bg-blue-50 rounded-xl text-center">
                            <p class="text-xs font-semibold text-blue-600 mb-1">Total Deposited</p>
                            <p class="text-lg font-extrabold text-blue-800" id="totalDeposited">₹0</p>
                        </div>
                        <div class="p-4 bg-purple-50 rounded-xl text-center">
                            <p class="text-xs font-semibold text-purple-600 mb-1">Total Interest</p>
                            <p class="text-lg font-extrabold text-purple-800" id="totalInterest">₹0</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer"></footer>
    <div id="toast-container"></div>
    <script src="/common.js?v=4.0"></script>
    <script>
    (function() {
        document.getElementById('rdForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var P = parseFloat(document.getElementById('deposit').value);
            var annualRate = parseFloat(document.getElementById('rate').value) / 100;
            var n = parseInt(document.getElementById('tenure').value);

            if (isNaN(P) || P < 100 || isNaN(n) || n < 6) {
                if (typeof showToast === 'function') showToast('Please enter valid values.', 'error');
                return;
            }

            // RD formula with quarterly compounding
            var r = annualRate / 4; // quarterly rate
            var quarters = n / 3; // number of quarters
            var maturity = 0;

            for (var i = 0; i < n; i++) {
                var monthsRemaining = n - i;
                var quartersRemaining = monthsRemaining / 3;
                maturity += P * Math.pow(1 + r, quartersRemaining);
            }

            var totalDeposited = P * n;
            var totalInterest = maturity - totalDeposited;

            document.getElementById('maturityAmount').textContent = '₹' + Math.round(maturity).toLocaleString('en-IN');
            document.getElementById('totalDeposited').textContent = '₹' + Math.round(totalDeposited).toLocaleString('en-IN');
            document.getElementById('totalInterest').textContent = '₹' + Math.round(totalInterest).toLocaleString('en-IN');

            document.getElementById('result').classList.remove('hidden');
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    })();
    </script>
