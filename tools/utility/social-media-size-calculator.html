<!DOCTYPE html>
<html lang="en">
<head>
    <script>try{if(localStorage.getItem('optidrop_dark_mode')==='1'){document.documentElement.classList.add('dark-mode');}}catch(e){}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Image Size Calculator 2026 | OptiDrop</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2">
    <meta name="description" content="Find the correct image dimensions for all social media platforms in 2026. Instagram, Facebook, Twitter/X, LinkedIn, YouTube sizes with one-click copy.">
    <meta name="author" content="OptiDrop">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://optidrop.online/tools/utility/social-media-size-calculator.html">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=2.1">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
        {"@type":"ListItem","position":1,"name":"Home","item":"https://optidrop.online"},
        {"@type":"ListItem","position":2,"name":"Utility Tools","item":"https://optidrop.online/tools/utility/"},
        {"@type":"ListItem","position":3,"name":"Social Media Size Calculator","item":"https://optidrop.online/tools/utility/social-media-size-calculator.html"}
    ]}
    </script>
    <style>
        .platform-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9999px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#64748b;transition:all 0.15s;}
        .platform-chip:hover{border-color:#93c5fd;color:#2563eb;}
        .platform-chip.active{background:#2563eb;color:#fff;border-color:#2563eb;}
        .size-table{width:100%;border-collapse:separate;border-spacing:0;}
        .size-table th{text-align:left;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#64748b;font-weight:600;border-bottom:2px solid #e2e8f0;}
        .size-table td{padding:10px 14px;border-bottom:1px solid #f1f5f9;font-size:14px;}
        .size-table tr:hover td{background:#f8fafc;}
        .platform-badge{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:600;}
        .copy-btn{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;cursor:pointer;transition:all 0.15s;}
        .copy-btn:hover{background:#e0e7ff;color:#4338ca;border-color:#a5b4fc;}
        .copy-btn.copied{background:#dcfce7;color:#16a34a;border-color:#86efac;}
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="site-header"></header>
    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Social Media Image Size Calculator</h1>
        <p class="text-slate-600 mb-6">Find the correct image dimensions for every social media platform in 2026. Click to copy dimensions instantly.</p>

        <!-- Filter Chips -->
        <div class="flex flex-wrap gap-2 mb-6" id="platformChips">
            <button class="platform-chip active" data-platform="all">All Platforms</button>
            <button class="platform-chip" data-platform="instagram">Instagram</button>
            <button class="platform-chip" data-platform="facebook">Facebook</button>
            <button class="platform-chip" data-platform="twitter">Twitter/X</button>
            <button class="platform-chip" data-platform="linkedin">LinkedIn</button>
            <button class="platform-chip" data-platform="youtube">YouTube</button>
            <button class="platform-chip" data-platform="other">Other</button>
        </div>

        <!-- Sizes Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="size-table" id="sizeTable">
                    <thead>
                        <tr>
                            <th>Platform</th>
                            <th>Image Type</th>
                            <th>Dimensions</th>
                            <th>Aspect Ratio</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="sizeTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>
    <footer class="site-footer"></footer>
    <div id="toast-container"></div>
    <script src="/common.js?v=2.1"></script>
    <script>
    (function(){
        function showToast(msg,type){
            var c=document.getElementById('toast-container');
            if(!c)return;
            var t=document.createElement('div');
            t.className='toast toast-'+(type||'info');
            t.textContent=msg;
            c.appendChild(t);
            setTimeout(function(){t.remove();},3000);
        }

        var sizes=[
            {platform:"instagram",name:"Instagram",type:"Post (Square)",w:1080,h:1080,ratio:"1:1",color:"#E1306C"},
            {platform:"instagram",name:"Instagram",type:"Post (Portrait)",w:1080,h:1350,ratio:"4:5",color:"#E1306C"},
            {platform:"instagram",name:"Instagram",type:"Post (Landscape)",w:1080,h:566,ratio:"1.91:1",color:"#E1306C"},
            {platform:"instagram",name:"Instagram",type:"Story / Reel",w:1080,h:1920,ratio:"9:16",color:"#E1306C"},
            {platform:"instagram",name:"Instagram",type:"Profile Picture",w:320,h:320,ratio:"1:1",color:"#E1306C"},
            {platform:"instagram",name:"Instagram",type:"Carousel",w:1080,h:1080,ratio:"1:1",color:"#E1306C"},
            {platform:"facebook",name:"Facebook",type:"Post (Landscape)",w:1200,h:630,ratio:"1.91:1",color:"#1877F2"},
            {platform:"facebook",name:"Facebook",type:"Post (Square)",w:1080,h:1080,ratio:"1:1",color:"#1877F2"},
            {platform:"facebook",name:"Facebook",type:"Cover Photo",w:820,h:312,ratio:"2.63:1",color:"#1877F2"},
            {platform:"facebook",name:"Facebook",type:"Profile Picture",w:170,h:170,ratio:"1:1",color:"#1877F2"},
            {platform:"facebook",name:"Facebook",type:"Event Cover",w:1200,h:628,ratio:"1.91:1",color:"#1877F2"},
            {platform:"twitter",name:"Twitter/X",type:"Post Image",w:1600,h:900,ratio:"16:9",color:"#1DA1F2"},
            {platform:"twitter",name:"Twitter/X",type:"Profile Picture",w:400,h:400,ratio:"1:1",color:"#1DA1F2"},
            {platform:"twitter",name:"Twitter/X",type:"Header Photo",w:1500,h:500,ratio:"3:1",color:"#1DA1F2"},
            {platform:"twitter",name:"Twitter/X",type:"Card Image",w:1200,h:628,ratio:"1.91:1",color:"#1DA1F2"},
            {platform:"linkedin",name:"LinkedIn",type:"Post Image",w:1200,h:627,ratio:"1.91:1",color:"#0A66C2"},
            {platform:"linkedin",name:"LinkedIn",type:"Profile Picture",w:400,h:400,ratio:"1:1",color:"#0A66C2"},
            {platform:"linkedin",name:"LinkedIn",type:"Cover Photo",w:1584,h:396,ratio:"4:1",color:"#0A66C2"},
            {platform:"linkedin",name:"LinkedIn",type:"Company Logo",w:300,h:300,ratio:"1:1",color:"#0A66C2"},
            {platform:"linkedin",name:"LinkedIn",type:"Company Cover",w:1128,h:191,ratio:"5.9:1",color:"#0A66C2"},
            {platform:"youtube",name:"YouTube",type:"Thumbnail",w:1280,h:720,ratio:"16:9",color:"#FF0000"},
            {platform:"youtube",name:"YouTube",type:"Channel Art",w:2560,h:1440,ratio:"16:9",color:"#FF0000"},
            {platform:"youtube",name:"YouTube",type:"Profile Picture",w:800,h:800,ratio:"1:1",color:"#FF0000"},
            {platform:"other",name:"OG Image",type:"Open Graph",w:1200,h:630,ratio:"1.91:1",color:"#6366F1"},
            {platform:"other",name:"Pinterest",type:"Pin",w:1000,h:1500,ratio:"2:3",color:"#E60023"},
            {platform:"other",name:"TikTok",type:"Video Cover",w:1080,h:1920,ratio:"9:16",color:"#000000"}
        ];

        var activePlatform='all';

        function gcd(a,b){return b===0?a:gcd(b,a%b);}

        function renderTable(){
            var tbody=document.getElementById('sizeTableBody');
            var filtered=activePlatform==='all'?sizes:sizes.filter(function(s){return s.platform===activePlatform;});

            if(filtered.length===0){
                tbody.innerHTML='<tr><td colspan="5" class="text-center text-slate-500 py-8">No sizes found for this platform.</td></tr>';
                return;
            }

            var html='';
            for(var i=0;i<filtered.length;i++){
                var s=filtered[i];
                html+='<tr>';
                html+='<td><span class="platform-badge" style="background:'+s.color+'15;color:'+s.color+';">'+s.name+'</span></td>';
                html+='<td class="font-medium text-slate-900">'+s.type+'</td>';
                html+='<td><span class="font-mono font-semibold text-slate-800">'+s.w+' x '+s.h+'</span></td>';
                html+='<td class="text-slate-500">'+s.ratio+'</td>';
                html+='<td><button class="copy-btn" data-w="'+s.w+'" data-h="'+s.h+'" onclick="copySize(this,'+s.w+','+s.h+')">Copy</button></td>';
                html+='</tr>';
            }
            tbody.innerHTML=html;
        }

        // Global copy function
        window.copySize=function(btn,w,h){
            var text=w+' x '+h;
            navigator.clipboard.writeText(text).then(function(){
                btn.textContent='Copied!';
                btn.classList.add('copied');
                setTimeout(function(){
                    btn.textContent='Copy';
                    btn.classList.remove('copied');
                },1500);
            }).catch(function(){
                // Fallback
                var ta=document.createElement('textarea');
                ta.value=text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent='Copied!';
                btn.classList.add('copied');
                setTimeout(function(){
                    btn.textContent='Copy';
                    btn.classList.remove('copied');
                },1500);
            });
            if(window.OptiTrack)OptiTrack.toolCompleted('Social Media Size Calculator','copy');
        };

        // Filter chips
        document.getElementById('platformChips').addEventListener('click',function(e){
            var chip=e.target.closest('.platform-chip');
            if(!chip)return;
            activePlatform=chip.getAttribute('data-platform');
            document.querySelectorAll('.platform-chip').forEach(function(c){c.classList.remove('active');});
            chip.classList.add('active');
            renderTable();
        });

        renderTable();
    })();
    </script>
</body>
</html>
