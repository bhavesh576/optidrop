    <script>
    (function() {
        var gitignoreData = {
            node: { name: 'Node.js', content: 'node_modules/\nnpm-debug.log\nyarn-debug.log\nyarn-error.log\n.env\n.env.local\ndist/\nbuild/\n.DS_Store\n*.log\npackage-lock.json\nyarn.lock\n.pnp\n.pnp.js\ncoverage/\n.cache/\n' },

            java: { name: 'Java', content: '*.class\n*.log\n*.ctxt\n.mtj.tmp/\n*.jar\n*.war\n*.nar\n*.ear\n*.zip\n*.tar.gz\n*.rar\nhs_err_pid*\nreplay_pid*\nbuild/\n.gradle/\n.idea/\n*.iml\nout/\n' },
            react: { name: 'React', content: 'node_modules/\nbuild/\ndist/\n.env\n.env.local\n.env.development.local\n.env.test.local\n.env.production.local\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n.DS_Store\ncoverage/\n' },
            nextjs: { name: 'Next.js', content: 'node_modules/\n.next/\nout/\nbuild/\n.env\n.env.local\n.env.development.local\n.env.test.local\n.env.production.local\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n.DS_Store\n.vercel\n' },
            angular: { name: 'Angular', content: 'node_modules/\ndist/\n.tmp/\n.sass-cache/\n.idea/\n*.iml\ncoverage/\n.env\nnpm-debug.log\n' },
            vue: { name: 'Vue.js', content: 'node_modules/\ndist/\n.env\n.env.local\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n.DS_Store\ncoverage/\n' },
            django: { name: 'Django', content: '*.pyc\n__pycache__/\nlocal_settings.py\ndb.sqlite3\ndb.sqlite3-journal\nmedia/\nstaticfiles/\n.env\nvenv/\n*.log\n' },
            flask: { name: 'Flask', content: '__pycache__/\n*.py[cod]\n.env\nvenv/\ninstance/\n.wsgi_pid\n*.log\n' },
            laravel: { name: 'Laravel', content: 'vendor/\nnode_modules/\n.env\n.env.backup\n.phpunit.result.cache\nHomestead.json\nHomestead.yaml\nnpm-debug.log\nyarn-error.log\ndesktop.ini\nThumbs.db\n' },
            ruby: { name: 'Ruby', content: '*.gem\n*.rbc\n/.config\n/coverage/\n/InstalledFiles\n/pkg/\n/spec/reports/\n/spec/examples.txt\n/test/tmp/\n/test/version_tmp/\n/tmp/\n.env\n.byebug_history\n' },
            go: { name: 'Go', content: '# Binaries\n*.exe\n*.exe~\ndll*\n*.dylib\n*.so\n*.test\n*.out\nvendor/\n.env\n' },
            rust: { name: 'Rust', content: 'target/\nCargo.lock\n*.pdb\n.env\n' },
            swift: { name: 'Swift', content: '.build/\nPackages/\nxcuserdata/\n*.xcodeproj/\nDerivedData/\n.env\n' },
            kotlin: { name: 'Kotlin', content: '*.class\n*.log\n*.jar\nbuild/\n.gradle/\n.idea/\n*.iml\nout/\n' },
            dart: { name: 'Dart/Flutter', content: '.dart_tool/\n.flutter-plugins\n.flutter-plugins-dependencies\n.packages\npubspec.lock\nbuild/\n*.iml\n.idea/\n.env\n' },
            php: { name: 'PHP', content: 'vendor/\n.env\ncomposer.lock\n*.log\n.idea/\n' },
            csharp: { name: 'C# / .NET', content: 'bin/\nobj/\n*.user\n*.suo\n*.cache\n*.dll\n*.exe\n.vs/\npackages/\n.env\n' },
            cpp: { name: 'C++', content: '*.o\n*.obj\n*.exe\n*.out\n*.a\n*.so\n*.dylib\nbuild/\n.env\n' },
            android: { name: 'Android', content: '*.iml\n.gradle/\n/local.properties\n.idea/\n.DS_Store\n/build/\n/captures\n.externalNativeBuild\n.cxx/\n*.apk\n*.ap_\n*.aab\n' },
            ios: { name: 'iOS', content: 'build/\nDerivedData/\n*.pbxuser\n*.mode1v3\n*.mode2v3\n*.perspectivev3\nxcuserdata/\n*.xccheckout\n*.moved-aside\n*.hmap\n*.ipa\n*.dSYM.zip\n*.dSYM\nPods/\n.env\n' },
            xcode: { name: 'Xcode', content: 'build/\nDerivedData/\n*.pbxuser\n*.mode1v3\n*.mode2v3\n*.perspectivev3\nxcuserdata/\n*.xccheckout\n*.moved-aside\n*.hmap\n*.ipa\n*.dSYM.zip\n*.dSYM\n' },
            macos: { name: 'macOS', content: '.DS_Store\n.AppleDouble\n.LSOverride\nIcon\n._*\n.Spotlight-V100\n.Trashes\n' },

            linux: { name: 'Linux', content: '*~\n.fuse_hidden*\n.Directory\n.Trash-*\n.nfs*\n' },
            vscode: { name: 'VS Code', content: '.vscode/*\n!.vscode/settings.json\n!.vscode/tasks.json\n!.vscode/launch.json\n!.vscode/extensions.json\n*.code-workspace\n' },
            intellij: { name: 'IntelliJ IDEA', content: '.idea/\n*.iml\nout/\n.idea_modules/\n' },
            vim: { name: 'Vim', content: 'Session.vim\nSessionx.vim\n.netrwhist\n*~\n.tags\n[._]*.s[a-v][a-z]\n[._]*.sw[a-p]\n' },
            docker: { name: 'Docker', content: '.docker/\ndocker-compose.override.yml\n' },
            terraform: { name: 'Terraform', content: '*.tfstate\n*.tfstate.*\n.terraform/\n*.tfvars\n!*.tfvars.example\n.crash.log\ncrash.log\noverride.tf\noverride.tf.json\n*_override.tf\n*_override.tf.json\n.terraformrc\nterraform.rc\n' },
            elixir: { name: 'Elixir', content: '/_build/\n/cover/\n/deps/\n/doc/\n/.fetch\nerl_crash.dump\n*.ez\n*.beam\n/tmp/\n.env\n' },
            haskell: { name: 'Haskell', content: 'dist\n*.hi\n*.o\n.stack-work/\ncabal.project.local\n.env\n' }
        };

        var grid = document.getElementById('optionsGrid');
        Object.keys(gitignoreData).forEach(function(key) {
            var label = document.createElement('label');
            label.className = 'flex items-center gap-2 p-2 rounded-lg border border-slate-200 hover:border-blue-300 cursor-pointer transition-colors bg-white';
            label.innerHTML = '<input type="checkbox" value="' + key + '" class="rounded text-blue-600"> <span class="text-sm font-medium text-slate-700">' + gitignoreData[key].name + '</span>';
            grid.appendChild(label);
        });

        window.selectAll = function() {
            grid.querySelectorAll('input[type="checkbox"]').forEach(function(cb) { cb.checked = true; });
        };

        window.clearAll = function() {
            grid.querySelectorAll('input[type="checkbox"]').forEach(function(cb) { cb.checked = false; });
        };

        var generatedContent = '';

        window.generate = function() {
            var selected = [];
            grid.querySelectorAll('input:checked').forEach(function(cb) { selected.push(cb.value); });

            if (selected.length === 0) {
                if (typeof showToast === 'function') showToast('Please select at least one option.', 'error');
                return;
            }

            var content = '# Generated by OptiDrop .gitignore Generator\n# https://optidrop.online/tools/developer/gitignore-generator.html\n\n';
            selected.forEach(function(key) {
                content += '# === ' + gitignoreData[key].name + ' ===\n';
                content += gitignoreData[key].content + '\n';
            });

            generatedContent = content;
            document.getElementById('output').textContent = content;
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        window.copyToClipboard = function() {
            navigator.clipboard.writeText(generatedContent).then(function() {
                if (typeof showToast === 'function') showToast('Copied to clipboard!', 'success');
            });
        };

        window.downloadFile = function() {
            var blob = new Blob([generatedContent], { type: 'text/plain' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '.gitignore';
            a.click();
            URL.revokeObjectURL(a.href);
            if (typeof showToast === 'function') showToast('Downloaded .gitignore file!', 'success');
        };
    })();
    </script>
